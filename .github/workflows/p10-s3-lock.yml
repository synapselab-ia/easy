name: P10-S3 lockfile materializer

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/p10-s3-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --save-exact @supabase/supabase-js@2.112.3
      - name: Commit generated dependency files and remove temporary workflow
        run: |
          rm .github/workflows/p10-s3-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/p10-s3-lock.yml
          git commit -m "build(p10-s3): pin supabase-js dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

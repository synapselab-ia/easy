name: P6-S1 E2E diagnostic

on:
  push:
    branches:
      - feature/p6-s1-qa-deploy-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint diagnostic
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Vitest diagnostic
        id: vitest
        continue-on-error: true
        run: npx vitest run
      - name: E2E diagnostic
        id: e2e
        continue-on-error: true
        run: npx playwright test --retries=0 --workers=4 --timeout=10000 --reporter=line
      - name: Build diagnostic
        id: build
        continue-on-error: true
        run: npm run build
      - name: Report baseline outcomes
        if: always()
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "vitest=${{ steps.vitest.outcome }}"
          echo "e2e=${{ steps.e2e.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          if [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.vitest.outcome }}" != "success" ] || \
             [ "${{ steps.e2e.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi

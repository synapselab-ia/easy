name: P6-S1 E2E diagnostic

on:
  push:
    branches:
      - feature/p6-s1-qa-deploy-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E diagnostic
        run: npx playwright test --retries=0 --workers=4 --timeout=10000 --reporter=line

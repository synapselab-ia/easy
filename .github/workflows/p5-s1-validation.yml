name: P5-S1 validation

on:
  push:
    branches:
      - feature/p5-s1-backup-preflight
  pull_request:
    branches:
      - develop
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: P5-S1 backup contract
        run: npx vitest run src/services/backupService.test.ts

      - name: P5-S1 backup UI preflight
        run: npx vitest run src/components/backup/ImportExport.test.tsx

      - name: P3 occurrence backup regression
        run: npx vitest run src/services/backupService.occurrence.test.ts

      - name: Dexie migration regression
        run: npx vitest run src/db/database.test.ts src/db/occurrenceMigration.test.ts

      - name: P2 transaction audit regression
        run: npx vitest run src/hooks/useTransactions.test.tsx src/components/transactions/TransactionCorrectionDialog.test.tsx src/components/transactions/TransactionTable.test.tsx

      - name: P1 lifecycle regression
        run: npx vitest run src/hooks/useItems.test.tsx src/hooks/useResellers.test.tsx

      - name: P3 financial domain regression
        run: npx vitest run src/domain/transactions.test.ts src/domain/transactions.p3s2.test.ts

      - name: Build
        run: npm run build

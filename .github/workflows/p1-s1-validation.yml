name: P1-S1 validation

on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint baseline (informational)
        continue-on-error: true
        run: npm run lint

      - name: Full test baseline (informational)
        continue-on-error: true
        run: npm run test -- --run

      - name: P1-S1 database migration tests
        run: npx vitest run src/db/database.test.ts

      - name: P1-S1 reseller lifecycle hook tests
        run: npx vitest run src/hooks/useResellers.test.tsx

      - name: P1-S1 transaction guard tests
        run: npx vitest run src/hooks/useTransactions.test.tsx

      - name: P1-S1 search lifecycle tests
        run: npx vitest run src/hooks/useSearch.test.tsx

      - name: P1-S1 transaction form tests
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx

      - name: Capture CommandCenter suite
        id: command_center
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/components/search/CommandCenter.test.tsx --reporter=verbose 2>&1 | tee command-center.log

      - name: Upload CommandCenter diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-log
          path: command-center.log
          if-no-files-found: error

      - name: Enforce CommandCenter gate
        if: steps.command_center.outcome != 'success'
        run: exit 1

      - name: P1-S1 reseller page integration tests
        run: npx vitest run src/pages/ResellersPage.test.tsx

      - name: P1-S1 reseller detail tests
        run: npx vitest run src/pages/ResellerDetailPage.test.tsx

      - name: Build
        run: npm run build

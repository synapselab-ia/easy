name: P1-S1 validation

on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint baseline (informational)
        continue-on-error: true
        run: npm run lint

      - name: Full test baseline (informational)
        continue-on-error: true
        run: npm run test -- --run

      - name: P1-S1 targeted test gate
        run: >-
          npx vitest run
          src/db/database.test.ts
          src/hooks/useResellers.test.tsx
          src/hooks/useTransactions.test.tsx
          src/hooks/useSearch.test.tsx
          src/components/transactions/TransactionForm.test.tsx
          src/components/search/CommandCenter.test.tsx
          src/pages/ResellersPage.test.tsx
          src/pages/ResellerDetailPage.test.tsx

      - name: Build
        run: npm run build

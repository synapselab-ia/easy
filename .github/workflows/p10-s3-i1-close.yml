          from pathlib import Path

          def edit(path, replacements=(), prepend_after=None, prepend_text=None):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one anchor, got {count}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              if prepend_after is not None:
                  count = s.count(prepend_after)
                  if count != 1:
                      raise SystemExit(f'{path}: prepend anchor count {count}')
                  s = s.replace(prepend_after, prepend_after + prepend_text, 1)

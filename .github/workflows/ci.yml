name: Critical QA

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical QA - lint
        run: npm run lint

      - name: Diagnostic - TransactionForm JSON
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx --reporter=json --outputFile=vitest-transaction-form.json

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-transaction-form
          path: vitest-transaction-form.json
          if-no-files-found: error

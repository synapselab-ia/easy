name: Critical QA

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical QA - lint
        run: npm run lint

      - name: Diagnostic - defaults
        if: always()
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx -t "should keep reseller, type and date enabled by default for continuous entry"

      - name: Diagnostic - order retention
        if: always()
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx -t "should keep selected order fields and clear unselected fields when adding another transaction"

      - name: Diagnostic - payment retention
        if: always()
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx -t "should allow payment value retention only when the operator selects it"

      - name: Diagnostic - cancel reset
        if: always()
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx -t "should clear entered data on cancel and restore the requested initial type"

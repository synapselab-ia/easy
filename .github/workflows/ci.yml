name: Critical QA

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical QA - lint
        run: npm run lint

      - name: Critical QA - unit
        run: npm run test:run

      - name: Critical QA - e2e
        run: npm run test:e2e

      - name: Critical QA - build
        run: npm run build

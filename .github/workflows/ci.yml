name: Critical QA

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical QA
        run: npm run qa:critical

      - name: P10-S1-I2 remote rehearsal
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/p10-s1-i2-rehearsal'
        env:
          P10_CANDIDATE_URL: https://easy-v2-lvbggu5ji-synapselabia-8285s-projects.vercel.app/
          P10_CANDIDATE_SHA: 2b6c1e5f4e58790c9c805fed8cadda3484acfa0e
        run: npx playwright test --config=playwright.p10.config.ts

name: Critical QA

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit suite JSON
        run: npx vitest run --reporter=json --outputFile=vitest-all.json

      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-all
          path: vitest-all.json
          if-no-files-found: error

- current Supabase documentation confirms paid automatic backups, Free-plan `db dump` + off-site recommendation, Free pausing behavior and supported logical dump/restore tooling;
- no real store data or real operator identity was used.

D-030 accepts the contract only. Repository D-019 on the contract/canonical closure tree is mandatory before integration; final run/job and exact merge-ref identity are recorded in PR closure evidence.

'''
          marker = '## Known non-blocking debt\n'
          if marker not in s:
              raise SystemExit('QA marker missing')
          s = s.replace(marker, qa + marker, 1)
          save(p, s)

          # CHANGELOG
          p = 'docs/V2/CHANGELOG.md'
          s = load(p)
          entry = '''## 2026-08-20 — P10-S3-I2 migration + zero-cost durability contract accepted as D-030

P10-S3-I2 defined the real-data migration/reconciliation contract without moving real store data. Source inspection exposed a deliberate compatibility boundary: stable-v1 items normalize active but unclassified, while the current Supabase public `items` table requires active items to have categories. D-030 therefore forbids direct v1 insertion and selects a non-exposed/private staging path, explicit **current** item classification, then atomic promotion while historical stable-v1 order category snapshots remain null.


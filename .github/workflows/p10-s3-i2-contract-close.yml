Provider guidance supporting the zero-cost route explicitly recommends `supabase db dump` plus off-site backups for Free projects; the project still requires its own unattended/off-site verification and restore evidence before production.

'''
          marker = '---\n\n# Open decisions\n'
          if marker not in s:
              raise SystemExit('DECISIONS insertion marker missing')
          s = s.replace(marker, d030 + '---\n\n# Open decisions\n', 1)
          s = replace_once(
              s,
              '- with current paid-infrastructure budget fixed at US$ 0, whether a zero-cost production/recovery posture can satisfy D-029; otherwise production cutover remains blocked;',
              '- whether the trusted operator environment can objectively implement/prove D-030 off-site synchronization and exact-24h unattended recovery health; if it cannot, production cutover remains blocked;',
              'DECISIONS open',
          )
          save(p, s)

          # QA LEDGER
          p = 'docs/V2/QA_LEDGER.md'
          s = load(p)
          qa = '''## P10-S3-I2 migration/durability contract — EVIDENCE READY / D-019 REQUIRED BEFORE INTEGRATION

Contract-definition evidence:

- `develop` source baseline: `5e2decd337b7912f118801cd75cbb27e4e03cfc2`;
- stable `main`: `9574e3a4097ddd78ab1f75a13b9ea065287946e9`;
- stable source inspection confirms backup version 1 with `items`, `resellers`, `transactions` and Dexie V1 business shapes;
- current V2 normalization inspection confirms legacy missing lifecycle -> active, missing transaction `occurredAt` -> `createdAt`, and no fabricated category history;
- live `easy-v2` recheck: `ACTIVE_HEALTHY`, 0 Auth users and 0 rows in `easy_operators`, `categories`, `items`, `resellers`, `transactions`;
- live item constraint recheck confirms `items_active_requires_category`, proving direct active-unclassified v1 item insertion is incompatible and must use the D-030 private staging/classification path;

name: P10-S3-I1 QA ledger order

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - .github/workflows/p10-s3-i1-qa-order.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/V2/QA_LEDGER.md')
          s = p.read_text()
          a = '## Known non-blocking debt\n\n## P10-S3-I1 Supabase foundation — PASS / ACCEPTED'
          b = '## P10-S3-I1 Supabase foundation — PASS / ACCEPTED'
          if s.count(a) != 1:
              raise SystemExit(f'first QA anchor count={s.count(a)}')
          s = s.replace(a, b, 1)
          a2 = '\n\n\nExisting mocked-select hydration warnings'
          b2 = '\n\n## Known non-blocking debt\n\nExisting mocked-select hydration warnings'
          if s.count(a2) != 1:
              raise SystemExit(f'second QA anchor count={s.count(a2)}')
          p.write_text(s.replace(a2, b2, 1))
          PY
          rm -f .github/workflows/p10-s3-i1-qa-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/V2/QA_LEDGER.md .github/workflows/p10-s3-i1-qa-order.yml
          git commit -m "docs(v2): normalize P10-S3-I1 QA ledger"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

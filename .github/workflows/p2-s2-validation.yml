name: P2-S2 validation

on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: P2 transaction domain rules
        run: npx vitest run src/domain/transactions.test.ts

      - name: P2-S2 atomic correction mutation
        run: npx vitest run src/hooks/useTransactions.test.tsx

      - name: P2-S2 guided correction dialog
        run: npx vitest run src/components/transactions/TransactionCorrectionDialog.test.tsx

      - name: P2 history actions and linkage
        run: npx vitest run src/components/transactions/TransactionTable.test.tsx

      - name: P2 dashboard consistency
        run: npx vitest run src/hooks/useDashboard.test.tsx

      - name: P2 search consistency
        run: npx vitest run src/hooks/useSearch.test.tsx

      - name: P2 PDF audit consistency
        run: npx vitest run src/services/pdfService.test.ts

      - name: P2 reseller detail regression
        run: npx vitest run src/pages/ResellerDetailPage.test.tsx

      - name: P1 database migration regression
        run: npx vitest run src/db/database.test.ts

      - name: P1 reseller lifecycle regression
        run: npx vitest run src/hooks/useResellers.test.tsx

      - name: P1 item lifecycle regression
        run: npx vitest run src/hooks/useItems.test.tsx

      - name: P1 transaction form regression
        run: npx vitest run src/components/transactions/TransactionForm.test.tsx

      - name: P1 Command Center regression
        run: npx vitest run src/components/search/CommandCenter.test.tsx

      - name: P1 reseller integration regression
        run: npx vitest run src/pages/ResellersPage.test.tsx

      - name: P1 item integration regression
        run: npx vitest run src/pages/ItemsPage.test.tsx

      - name: Build
        run: npm run build

name: P10-S3-I2 QA evidence closure

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - .github/workflows/p10-s3-i2-qa-evidence.yml

permissions:
  contents: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/V2/QA_LEDGER.md')
          s = p.read_text()
          old_heading = '## P10-S3-I2 migration/durability contract — EVIDENCE READY / D-019 REQUIRED BEFORE INTEGRATION'
          new_heading = '## P10-S3-I2 migration/durability contract — PASS / ACCEPTED'
          if s.count(old_heading) != 1:
              raise SystemExit(f'heading count={s.count(old_heading)}')
          s = s.replace(old_heading, new_heading, 1)
          old_tail = 'D-030 accepts the contract only. Repository D-019 on the contract/canonical closure tree is mandatory before integration; final run/job and exact merge-ref identity are recorded in PR closure evidence.'
          new_tail = 'D-030 accepts the contract only. Authoritative closure D-019 **`32399725148`** / **`96524749660`** passed on exact PR merge ref **`f18f9b6c3d77b1b95284e92487be8819a9a48922`**: 0 lint errors / 82 warnings; 54 files / 225 Vitest PASS; 17/17 Playwright PASS; production build PASS. This run validates the complete canonical contract tree before this evidence-line commit; a final tree-equivalent D-019 is required before merge.'
          if s.count(old_tail) != 1:
              raise SystemExit(f'tail count={s.count(old_tail)}')
          p.write_text(s.replace(old_tail, new_tail, 1))
          PY
          rm -f .github/workflows/p10-s3-i2-qa-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/V2/QA_LEDGER.md .github/workflows/p10-s3-i2-qa-evidence.yml
          git commit -m "docs(v2): record P10-S3-I2 D-019 evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
